; ESP8266 as a UART-attached WiFi NIC for the comwifi Linux driver.
;
;   pio run                      build (no hardware flow control)
;   pio run -e hwflow            build with RTS/CTS on GPIO15/GPIO13
;   pio run -t upload            flash over the board's own USB port
;
; Flash through USB first, then move the ESP to the ThinkPad's COM side.

[env]
platform = espressif8266
framework = arduino
board = d1_mini               ; any 4MB ESP8266 module works; change if needed
board_build.f_cpu = 160000000L
board_build.flash_mode = dio
upload_speed = 921600
monitor_speed = 115200
build_flags =
    -I../proto
    -O2
    -DNDEBUG
    -DPIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
    -DCW_FW_VERSION=0x00010000
    ; highest baud the firmware agrees to. 2M and 4M divide the 80 MHz UART
    ; clock exactly (0 % error); 3M is 1.2 % off, still fine.
    -DCW_MAX_BAUD=4000000

[env:esp8266]

[env:hwflow]
build_flags =
    ${env.build_flags}
    -DCW_HWFLOW=1
